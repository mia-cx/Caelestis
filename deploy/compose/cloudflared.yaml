# Optional temporary HTTPS URL. Works with any of the database/storage overrides.
# Read the URL with: docker compose logs cloudflared
# Set ORIGIN to that URL in .env, then recreate the frontend.
services:
  cloudflared:
    image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    command: [tunnel, --no-autoupdate, --url, 'http://frontend:3000']
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      frontend:
        condition: service_healthy
