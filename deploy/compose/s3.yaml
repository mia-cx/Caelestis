# A local S3-compatible service for either database adapter. Use a dedicated app bucket.
# RustFS replaced MinIO, whose images can no longer be pulled. The credential variables keep their
# MinIO names so existing .env files work unchanged.
x-s3: &s3
  OBJECT_STORAGE: s3
  S3_BUCKET: caelestis
  S3_ENDPOINT: http://s3:9000
  S3_REGION: us-east-1
  S3_FORCE_PATH_STYLE: 'true'
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-caelestis}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
  AWS_SESSION_TOKEN: ''
x-rustfs-image: &rustfs-image rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
services:
  backend:
    environment: *s3
    depends_on:
      s3-init:
        condition: service_completed_successfully
  frontend:
    environment: *s3
  # Copies an older stack's MinIO volume into the RustFS volume once, before RustFS first starts.
  # RustFS converts MinIO's single-drive layout itself. The MinIO volume is mounted read-only and
  # never changes, so it stays a complete rollback copy until you delete it.
  s3-migrate:
    image: *rustfs-image
    user: '0:0'
    restart: 'no'
    network_mode: none
    entrypoint: [sh, -eu, -c]
    command:
      - |
        status=$$(cat /state/status 2>/dev/null || true)
        if [ -n "$$status" ] && [ "$$status" != copying ]; then
          echo "MinIO migration: $$status"
          exit 0
        fi
        if [ ! -f /minio/.minio.sys/format.json ]; then
          echo none > /state/status
          echo 'MinIO migration: no MinIO data to copy'
          exit 0
        fi
        if [ -e /data/.rustfs.sys ]; then
          echo 'MinIO migration: the RustFS volume already holds data, but no migration was recorded.' >&2
          echo 'Delete the MinIO volume if RustFS already has everything, or delete the RustFS volume to copy again.' >&2
          exit 1
        fi
        echo copying > /state/status
        echo 'MinIO migration: copying the MinIO volume'
        find /data -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        cp -a /minio/. /data/
        chown -R 10001:10001 /data
        (cd /minio && find . -type f -exec md5sum {} + | sort) > /tmp/minio.md5
        (cd /data && find . -type f -exec md5sum {} + | sort) > /tmp/rustfs.md5
        if ! cmp -s /tmp/minio.md5 /tmp/rustfs.md5; then
          echo 'MinIO migration: the copy differs from the MinIO volume' >&2
          exit 1
        fi
        # MinIO keeps each object's metadata at <bucket>/<key>/xl.meta, and a folder object "a/" at
        # a/__XLDIR__/xl.meta. s3-init requires RustFS to list exactly these keys. Caelestis never
        # enables bucket versioning, so there are no delete markers to leave out.
        rm -rf /state/keys
        mkdir /state/keys
        for bucket in /minio/*/; do
          [ -d "$$bucket" ] || continue
          (cd "$$bucket" && find . -type f -name xl.meta | sed -e 's|^\./||' -e 's|/xl\.meta$$||' -e 's|__XLDIR__$$||') \
            > "/state/keys/$$(basename "$$bucket")"
        done
        # s3-init runs as node (uid 1000) and records the check, so hand it /state before marking it copied.
        echo copied > /state/status.next
        chown -R 1000:1000 /state
        mv /state/status.next /state/status
        echo "MinIO migration: copied $$(wc -l < /tmp/minio.md5) files; s3-init checks every object next"
    volumes:
      - s3:/minio:ro
      - rustfs:/data
      - s3-migration:/state
  s3:
    image: *rustfs-image
    command: [/data]
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-caelestis}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - rustfs:/data
    depends_on:
      s3-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9000/health/ready]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
  s3-init:
    image: ${CAELESTIS_BACKEND_IMAGE:-miacx/caelestis-backend:local}
    build:
      context: .
      target: backend
    restart: 'no'
    working_dir: /app/apps/backend
    environment: *s3
    depends_on:
      s3:
        condition: service_healthy
    volumes:
      - s3-migration:/state
    command:
      - node
      - --input-type=module
      - -e
      - |
        import { createHash } from 'node:crypto';
        import { readdir, readFile, writeFile } from 'node:fs/promises';
        import { createRequire } from 'node:module';
        import { setTimeout } from 'node:timers/promises';
        const { S3Client, CreateBucketCommand, GetObjectCommand, ListObjectsV2Command } = createRequire(import.meta.resolve('@caelestis/storage/s3'))('@aws-sdk/client-s3');
        const client = new S3Client({ endpoint: process.env.S3_ENDPOINT, region: process.env.S3_REGION, forcePathStyle: true });
        try {
          for (let attempt = 0; ; attempt++) {
            try { await client.send(new CreateBucketCommand({ Bucket: process.env.S3_BUCKET })); break; }
            catch (error) {
              if (error.name === 'BucketAlreadyOwnedByYou') break;
              if (attempt >= 29) throw error;
              await setTimeout(1000);
            }
          }
          // A copied MinIO volume only counts as migrated once RustFS lists exactly the keys MinIO
          // held, and every object still hashes to the MD5 ETag MinIO recorded when it stored it.
          const status = (await readFile('/state/status', 'utf8').catch(() => '')).trim();
          if (status === 'copied') {
            const unchanged = 'The MinIO volume is unchanged.';
            for (const bucket of await readdir('/state/keys')) {
              const expected = new Set((await readFile(`/state/keys/$${bucket}`, 'utf8')).split('\n').filter(Boolean));
              const listed = [];
              let token;
              do {
                const page = await client.send(new ListObjectsV2Command({ Bucket: bucket, ContinuationToken: token }));
                listed.push(...(page.Contents ?? []));
                token = page.NextContinuationToken;
              } while (token);
              const keys = new Set(listed.map((object) => object.Key));
              const missing = [...expected].filter((key) => !keys.has(key));
              const extra = [...keys].filter((key) => !expected.has(key));
              if (missing.length > 0 || extra.length > 0)
                throw new Error(`MinIO migration: $${bucket} is missing $${missing.length} keys (first: $${missing[0] ?? 'none'}) and has $${extra.length} MinIO did not (first: $${extra[0] ?? 'none'}). $${unchanged}`);
              // Multipart ETags are not an MD5 of the bytes, so those objects are only checked by key.
              const single = listed.filter((object) => /^"?[0-9a-f]{32}"?$$/.test(object.ETag ?? ''));
              for (let at = 0; at < single.length; at += 16) {
                await Promise.all(single.slice(at, at + 16).map(async (object) => {
                  const got = await client.send(new GetObjectCommand({ Bucket: bucket, Key: object.Key }));
                  const hash = createHash('md5');
                  for await (const chunk of got.Body) hash.update(chunk);
                  if (hash.digest('hex') !== object.ETag.replaceAll('"', ''))
                    throw new Error(`MinIO migration: $${bucket}/$${object.Key} no longer matches its ETag. $${unchanged}`);
                }));
              }
              console.log(`MinIO migration: $${bucket} has all $${listed.length} objects; $${single.length} re-read and matched`);
            }
            await writeFile('/state/status', 'verified\n');
            console.log('MinIO migration: verified');
          }
        } finally { client.destroy(); }
volumes:
  # The MinIO data from before RustFS. Delete it once the migration is verified.
  s3:
  rustfs:
  s3-migration:
