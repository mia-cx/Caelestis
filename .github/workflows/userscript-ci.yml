name: Userscript CI

on:
  pull_request:
    paths:
      - apps/userscript/**
      - packages/shared/**
      - .changeset/**
      - .github/scripts/*release*.mjs
      - .github/workflows/app-release.yml
      - .github/workflows/userscript-ci.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
  push:
    branches:
      - main
    paths:
      - apps/userscript/**
      - packages/shared/**
      - .changeset/**
      - .github/scripts/*release*.mjs
      - .github/workflows/app-release.yml
      - .github/workflows/userscript-ci.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact approved commit for full dependency validation
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: userscript-ci-${{ github.workflow }}-${{ inputs.source_sha || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test userscript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release tooling
        env:
          CHANGESET_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: pnpm test:release

      - name: Build userscript and dependencies
        run: pnpm --filter @caelestis/userscript... build

      - name: Typecheck userscript and dependencies
        run: pnpm --filter @caelestis/userscript... check

      - name: Test userscript and dependencies
        run: pnpm --filter @caelestis/userscript... test

      - name: Check repository lint and remaining root test suites
        if: inputs.source_sha != ''
        run: |
          pnpm lint
          pnpm --filter @caelestis/userscript test test/import-contract.test.ts
          pnpm test:capacity
          pnpm test:progress
          pnpm --filter @caelestis/userscript test test/api-telemetry.test.ts

      - name: Upload userscript build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caelestis-userscript-${{ inputs.source_sha || github.sha }}
          path: apps/userscript/dist/wplace-template-server.user.js
          if-no-files-found: error
          retention-days: 14
