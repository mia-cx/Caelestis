name: Portable server CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 23 * * *'
  workflow_call:
    inputs:
      extended:
        type: boolean
        default: false
      release_sha:
        description: Exact release or approved dependency commit; defaults to the triggering commit
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      extended:
        description: Include ARM64, upgrades, and database recovery
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: portable-ci-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.release_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Three gates. `server` is true when the diff touches the backend, frontend, shared packages,
    # deploy files, or the stack tooling; it enables the unit and contract tests and chart
    # schema checks. `stacks` additionally enables the image build and the Compose, Helm, and
    # scan matrix. Ordinary pull requests and main pushes never run the stacks; the Changesets
    # release pull request does, so deployment viability is proven once per release. `tooling`
    # is true when the inputs of `pnpm test:release` change (.github, .changeset, app manifests
    # and changelogs, root manifests) and runs that suite whether or not the server changed.
    # Scheduled, dispatched, and release runs always validate everything. The stack-tests check
    # still reports on every pull request, so a required check never blocks userscript work.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.changes.outputs.server }}
      stacks: ${{ steps.changes.outputs.stacks }}
      tooling: ${{ steps.changes.outputs.tooling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect server changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Reusable workflows inherit the caller's event, including a release merge's push.
          if [ -n "$RELEASE_SHA" ] || { [ "$EVENT" != pull_request ] && [ "$EVENT" != push ]; }; then
            echo 'server=true' >> "$GITHUB_OUTPUT"
            echo 'stacks=true' >> "$GITHUB_OUTPUT"
            echo 'tooling=true' >> "$GITHUB_OUTPUT"
            echo "${RELEASE_SHA:+release }$EVENT runs validate every stack"
            exit
          fi
          if [ "$EVENT" = pull_request ] && [ "$HEAD_REF" = changeset-release/main ]; then
            release_pr=true
          else
            release_pr=false
          fi
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo 'server=true' >> "$GITHUB_OUTPUT"
            echo "stacks=$release_pr" >> "$GITHUB_OUTPUT"
            echo 'tooling=true' >> "$GITHUB_OUTPUT"
            echo 'No reachable base commit; assuming server changes'
            exit
          fi
          if [ "$EVENT" = pull_request ]; then
            base="$(git merge-base "$BASE_SHA" HEAD)"
          else
            base="$BASE_SHA"
          fi
          cat > "$RUNNER_TEMP/server-paths" <<'EOF'
          ^apps/(backend|frontend)/
          ^packages/(shared|storage|ui|wire-schema)/
          ^deploy/
          ^fixtures/stack-tests/
          ^scripts/stack-tests/
          ^scripts/runtime-benchmark/
          ^scripts/(test-cloudflare-stack|test-helm-stack|test-portable-compose|test-portable-image|social-images|osm-tiles)\.
          ^scripts/social-images\.test\.mjs$
          ^Dockerfile$
          ^\.dockerignore$
          ^package\.json$
          ^pnpm-lock\.yaml$
          ^pnpm-workspace\.yaml$
          ^tsconfig\.base\.json$
          ^turbo\.json$
          ^\.github/workflows/portable-
          EOF
          # Inputs of `pnpm test:release`: the release scripts and their tests, every workflow
          # they assert, changeset state, and the app manifests and changelogs they parse.
          cat > "$RUNNER_TEMP/tooling-paths" <<'EOF'
          ^\.github/
          ^\.changeset/
          ^apps/[^/]+/(package\.json|CHANGELOG\.md)$
          ^package\.json$
          ^pnpm-lock\.yaml$
          EOF
          changed="$(git diff --name-only "$base" HEAD)"
          if printf '%s\n' "$changed" | grep -E -q -f "$RUNNER_TEMP/tooling-paths"; then
            echo 'tooling=true' >> "$GITHUB_OUTPUT"
            echo 'Release tooling inputs changed; running pnpm test:release'
          else
            echo 'tooling=false' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -E -f "$RUNNER_TEMP/server-paths"; then
            echo 'server=true' >> "$GITHUB_OUTPUT"
            echo "stacks=$release_pr" >> "$GITHUB_OUTPUT"
            if [ "$release_pr" = true ]; then
              echo 'Release pull request with server changes; validating every stack'
            else
              echo 'Server changed; running unit, contract, and chart checks. Stacks run on the release pull request.'
            fi
          else
            echo 'server=false' >> "$GITHUB_OUTPUT"
            echo 'stacks=false' >> "$GITHUB_OUTPUT"
            echo "No server files changed between $base and $GITHUB_SHA; skipping stack validation"
          fi

  release-tooling:
    # Cheap and independent of the server gate, so a workflow-only or changeset-only change
    # still proves the release scripts before merge.
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release

  matrix:
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.matrix.outputs.architectures }}
      extended: ${{ steps.matrix.outputs.extended }}
    steps:
      - id: matrix
        env:
          EXTENDED: ${{ github.event_name == 'schedule' || inputs.extended }}
        run: |
          if [ "$EXTENDED" = true ]; then
            echo 'architectures=["amd64","arm64"]' >> "$GITHUB_OUTPUT"
          else
            echo 'architectures=["amd64"]' >> "$GITHUB_OUTPUT"
          fi
          echo "extended=$EXTENDED" >> "$GITHUB_OUTPUT"

  runtime:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.8@sha256:2d2f4095530294735a857cfe22bb101e19b0849b416911c796ec4aa81b164a62
        env:
          MARIADB_ROOT_PASSWORD: portable-test
          MARIADB_DATABASE: caelestis
        ports: ['3306:3306']
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_PASSWORD: portable-test
          POSTGRES_DB: caelestis
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CAELESTIS_TEST_POSTGRES_URL: postgresql://postgres:portable-test@127.0.0.1:5432/caelestis
      CAELESTIS_TEST_MARIADB_URL: mariadb://root:portable-test@127.0.0.1:3306/caelestis
      CAELESTIS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      CAELESTIS_TEST_FRONTEND_HANDLER: ${{ github.workspace }}/apps/frontend/build/handler.js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start disposable S3 service
        run: |
          docker run -d --name portable-s3 -p 127.0.0.1:9000:9000 -e RUSTFS_ACCESS_KEY=caelestis-test -e RUSTFS_SECRET_KEY=caelestis-test-password rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff /data
          curl --retry 30 --retry-delay 1 --retry-all-errors --retry-max-time 60 --fail http://127.0.0.1:9000/health
      - name: Build and check the Node backend and frontend
        env:
          CAELESTIS_TARGET: node
          CAELESTIS_BUILD_ID: ${{ inputs.release_sha || github.sha }}
        run: |
          pnpm --filter @caelestis/backend... --filter @caelestis/frontend... build
          pnpm --filter @caelestis/backend... --filter @caelestis/frontend... check
      - name: Test every database and object-storage contract
        run: |
          test -n "$CAELESTIS_TEST_POSTGRES_URL"
          test -n "$CAELESTIS_TEST_MARIADB_URL"
          test -n "$CAELESTIS_TEST_S3_ENDPOINT"
          pnpm --filter @caelestis/backend --filter @caelestis/frontend --filter @caelestis/storage --filter @caelestis/wire-schema exec vitest run --maxWorkers=1 --testTimeout=30000 --hookTimeout=30000
          pnpm test:services
          pnpm test:worker
          pnpm test:social
          pnpm test:performance
          node --test scripts/stack-tests/*.test.mjs
          node --test scripts/runtime-benchmark/resources.test.mjs
      - name: Test backend and storage contracts under the pinned Bun runtime
        run: |
          docker create --name bun-runtime oven/bun:1.4.2-debian@sha256:4f6e31d1a54d6a3dd312daef655fc998101b5043d52e12592ac293ef04b9bc73
          docker cp bun-runtime:/usr/local/bin/bun "$RUNNER_TEMP/bun"
          docker rm bun-runtime
          chmod +x "$RUNNER_TEMP/bun"
          export PATH="$RUNNER_TEMP:$PATH"
          test "$(bun --version)" = 1.4.2
          pnpm --filter @caelestis/backend --filter @caelestis/storage exec bun --bun node_modules/vitest/vitest.mjs run --maxWorkers=1 --testTimeout=30000 --hookTimeout=30000
          node scripts/test-services.mjs --bun
          pnpm test:runtime
          CAELESTIS_PERFORMANCE=1 pnpm --filter @caelestis/backend exec bun --bun node_modules/vitest/vitest.mjs run src/telemetry/classify-chunk.test.ts
          pnpm --filter @caelestis/frontend exec bun --bun node_modules/vitest/vitest.mjs run src/tests/raster-contracts.test.ts
      - name: Build the Cloudflare deployment
        run: |
          pnpm --filter @caelestis/frontend build
          pnpm --filter @caelestis/backend exec wrangler deploy --dry-run --outdir /tmp/caelestis-worker
      - name: Exercise both Workers and real local bindings
        run: node scripts/test-cloudflare-stack.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cloudflare-local-results
          path: test-results/
          retention-days: 7

  image:
    needs: [changes, matrix]
    if: needs.changes.outputs.stacks == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.matrix.outputs.architectures) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build each release image once
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          for component in backend backend-bun frontend; do
            docker buildx build --target "$component" --platform "linux/$ARCH" \
              --build-arg CAELESTIS_BUILD_ID="$RELEASE_SHA" \
              --cache-from "type=gha,scope=$component-$ARCH" \
              --cache-to "type=gha,scope=$component-$ARCH,mode=max" \
              --tag "caelestis-$component:test" --load .
            runtime="$(docker inspect "caelestis-$component:test" --format '{{index .Config.Labels "cx.mia.caelestis.runtime"}}')"
            version="$(docker inspect "caelestis-$component:test" --format '{{index .Config.Labels "cx.mia.caelestis.runtime.version"}}')"
            test "$(docker run --rm --entrypoint node "caelestis-$component:test" -p "process.versions['$runtime']")" = "$version"
          done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Prepare the previous release for upgrade tests
        if: needs.matrix.outputs.extended == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: node scripts/stack-tests/prepare-baseline.mjs "$ARCH"
      - run: mkdir -p images
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: caelestis-backend:test
          output-file: images/backend-sbom.spdx.json
          upload-artifact: false
          syft-version: v1.51.1
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: caelestis-backend-bun:test
          output-file: images/backend-bun-sbom.spdx.json
          upload-artifact: false
          syft-version: v1.51.1
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: caelestis-frontend:test
          output-file: images/frontend-sbom.spdx.json
          upload-artifact: false
          syft-version: v1.51.1
      - name: Archive candidate and baseline images
        env:
          EXTENDED: ${{ needs.matrix.outputs.extended }}
        run: |
          mkdir -p images
          images=(caelestis-backend:test caelestis-backend-bun:test caelestis-frontend:test)
          if [ "$EXTENDED" = true ]; then images+=(caelestis-backend:baseline caelestis-frontend:baseline); fi
          docker save "${images[@]}" -o images/images.tar
          docker inspect caelestis-backend:test caelestis-backend-bun:test caelestis-frontend:test > images/image-configs.json
          (cd images && sha256sum images.tar *.json > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-images-${{ matrix.arch }}
          path: images/
          compression-level: 1
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && needs.matrix.outputs.extended == 'true'
        with:
          name: baseline-build-${{ matrix.arch }}
          path: test-results/baseline/
          retention-days: 7

  compose:
    needs: [changes, matrix, image]
    if: needs.changes.outputs.stacks == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.matrix.outputs.architectures) }}
        database: [sqlite, postgres, mariadb]
        storage: [filesystem, s3]
        runtime: [node, bun]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      CAELESTIS_TEST_EXTENDED: ${{ needs.matrix.outputs.extended }}
      CAELESTIS_BASELINE_BACKEND_IMAGE: ${{ needs.matrix.outputs.extended == 'true' && 'caelestis-backend:baseline' || '' }}
      CAELESTIS_BASELINE_FRONTEND_IMAGE: ${{ needs.matrix.outputs.extended == 'true' && 'caelestis-frontend:baseline' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portable-images-${{ matrix.arch }}
          path: images
      - name: Load verified image artifacts
        run: |
          (cd images && sha256sum --check SHA256SUMS)
          docker load -i images/images.tar
      - name: Run stack acceptance
        env:
          DATABASE: ${{ matrix.database }}
          STORAGE: ${{ matrix.storage }}
          BACKEND: ${{ matrix.runtime == 'bun' && 'caelestis-backend-bun:test' || 'caelestis-backend:test' }}
        run: node scripts/test-portable-compose.mjs "$BACKEND" caelestis-frontend:test "$DATABASE" "$STORAGE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compose-${{ matrix.arch }}-${{ matrix.runtime }}-${{ matrix.database }}-${{ matrix.storage }}
          path: test-results/
          retention-days: 7

  helm:
    needs: [changes, matrix, image]
    if: needs.changes.outputs.stacks == 'true'
    strategy:
      fail-fast: false
      matrix:
        stack: [sqlite, cnpg, mariadb]
        runtime: [node, bun]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CAELESTIS_TEST_EXTENDED: ${{ needs.matrix.outputs.extended }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Install kind
        run: |
          curl -fsSL https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o "$RUNNER_TEMP/kind"
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  $RUNNER_TEMP/kind" | sha256sum --check
          chmod +x "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portable-images-amd64
          path: images
      - name: Load verified image artifacts
        run: |
          (cd images && sha256sum --check SHA256SUMS)
          docker load -i images/images.tar
      - name: Install and exercise the shipped Helm chart
        env:
          STACK: ${{ matrix.stack }}
          BACKEND: ${{ matrix.runtime == 'bun' && 'caelestis-backend-bun:test' || 'caelestis-backend:test' }}
        run: node scripts/test-helm-stack.mjs "$BACKEND" caelestis-frontend:test "$STACK"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: helm-${{ matrix.runtime }}-${{ matrix.stack }}
          path: test-results/
          retention-days: 7

  scan:
    needs: [changes, matrix, image]
    if: needs.changes.outputs.stacks == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.matrix.outputs.architectures) }}
        component: [backend, backend-bun, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portable-images-${{ matrix.arch }}
          path: images
      - run: |
          (cd images && sha256sum --check SHA256SUMS)
          docker load -i images/images.tar
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: scan
        with:
          image: caelestis-${{ matrix.component }}:test
          output-format: json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          grype-version: v0.118.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.scan.outputs.json != ''
        with:
          name: scan-${{ matrix.arch }}-${{ matrix.component }}
          path: ${{ steps.scan.outputs.json }}
          retention-days: 7

  chart:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Install schema validator
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz -o /tmp/kubeconform.tar.gz
          echo '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  /tmp/kubeconform.tar.gz' | sha256sum --check
          tar -xzf /tmp/kubeconform.tar.gz -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate storage variants and migration job
        run: |
          helm lint deploy/helm/caelestis
          helm template local deploy/helm/caelestis | kubeconform -strict -summary
          helm template cnpg deploy/helm/caelestis -f deploy/helm/cnpg-s3.example.yaml | kubeconform -strict -summary
          helm template mariadb deploy/helm/caelestis -f deploy/helm/mariadb-s3.example.yaml | kubeconform -strict -summary
          helm template migrate deploy/helm/caelestis --set replicaCount=0,migration.enabled=true | kubeconform -strict -summary
          if helm template invalid deploy/helm/caelestis --set replicaCount=2; then exit 1; fi
          if helm template invalid deploy/helm/caelestis --set persistence.enabled=false; then exit 1; fi
          if helm template invalid deploy/helm/caelestis --set migration.enabled=true; then exit 1; fi

  stack-tests:
    if: always()
    needs: [changes, matrix, release-tooling, runtime, image, compose, helm, scan, chart]
    runs-on: ubuntu-latest
    steps:
      - name: Require every expected stack
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const results = JSON.parse(process.env.RESULTS);
            const { server, stacks, tooling } = results.changes.outputs;
            for (const [name, value] of [["server", server], ["stacks", stacks], ["tooling", tooling]]) {
              if (value !== "true" && value !== "false") throw new Error("changes: unknown " + name + " output " + JSON.stringify(value));
            }
            if (stacks === "true" && server !== "true") throw new Error("changes: stacks require server changes");
            const gate = { changes: "true", matrix: "true", "release-tooling": tooling, runtime: server, chart: server, image: stacks, compose: stacks, helm: stacks, scan: stacks };
            for (const [name, job] of Object.entries(results)) {
