name: Publish tested TAC images
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: portable-images-amd64
          run-id: 34929261635
          github-token: ${{ github.token }}
          path: images
      - name: Verify and publish the tested images
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ea53519b39713a2edce4640204e09975ecd15ad9
        shell: bash
        run: |
          (cd images && sha256sum --check SHA256SUMS)
          docker load -i images/images.tar
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for component in backend frontend; do
            source="$component"
            if [ "$component" = backend ]; then source=backend-bun; fi
            local_image="caelestis-$source:test"
            test "$(docker inspect "$local_image" --format '{{.Architecture}}')" = amd64
            test "$(docker inspect "$local_image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
            local_id="$(docker inspect "$local_image" --format '{{.Id}}')"
            jq -e --arg id "$local_id" 'any(.[]; .Id == $id)' images/image-configs.json >/dev/null
            image="ghcr.io/mia-riezebos/caelestis-$component:sha-$SOURCE_SHA"
            if docker manifest inspect "$image" > /tmp/manifest.json 2>/tmp/manifest-error; then
              test "$(jq -r .config.digest /tmp/manifest.json)" = "$local_id"
            else
              if ! grep -Eqi 'manifest unknown|no such manifest|not found' /tmp/manifest-error; then cat /tmp/manifest-error; exit 1; fi
              docker tag "$local_image" "$image"
              docker push "$image"
            fi
            docker manifest inspect "$image" > /tmp/manifest.json
            test "$(jq -r .config.digest /tmp/manifest.json)" = "$local_id"
            printf '%s\n' "$image" >> "$GITHUB_STEP_SUMMARY"
          done
