packages:
  - apps/*
  - packages/*
# svelte-package imports the compiler API but omits this peer, otherwise resolving root TS 7.
packageExtensions:
  '@sveltejs/package@2.5.8':
    peerDependencies:
      typescript: '>=5 <7'
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  workerd: true
minimumReleaseAgeExclude:
  - miniflare@5.20260910.0-alpha
  - wrangler@4.131.0
